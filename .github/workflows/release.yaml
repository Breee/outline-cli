name: Release

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.7"

      - run: make test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.7"

      - run: make e2e

  release:
    name: Create Release
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.7"

      - name: Check for relevant changes since last tag
        id: changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$LATEST_TAG" ]]; then
            CHANGED=$(git diff --name-only "$LATEST_TAG"..HEAD -- cmd internal main.go go.mod go.sum Dockerfile)
            if [[ -z "$CHANGED" ]]; then
              echo "No relevant changes since $LATEST_TAG — skipping release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Determine version
        id: version
        if: steps.changes.outputs.skip != 'true'
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            MAJOR=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f3)

            BUMP="${{ inputs.bump || 'patch' }}"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac

            VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$VERSION"
            git push origin "$VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: steps.changes.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.changes.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        if: steps.changes.outputs.skip != 'true'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Docker meta
        if: steps.changes.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ inputs.prerelease != true && !contains(steps.version.outputs.version, '-') }}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}

      - name: Build linux/amd64
        if: steps.changes.outputs.skip != 'true'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o outline
          tar czf outline_linux_amd64.tar.gz outline LICENSE README.md

      - name: Build linux/arm64
        if: steps.changes.outputs.skip != 'true'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o outline
          tar czf outline_linux_arm64.tar.gz outline LICENSE README.md

      - name: Build linux/armv7
        if: steps.changes.outputs.skip != 'true'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o outline
          tar czf outline_linux_armv7.tar.gz outline LICENSE README.md

      - name: Build darwin/amd64
        if: steps.changes.outputs.skip != 'true'
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o outline
          tar czf outline_darwin_amd64.tar.gz outline LICENSE README.md

      - name: Build darwin/arm64
        if: steps.changes.outputs.skip != 'true'
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o outline
          tar czf outline_darwin_arm64.tar.gz outline LICENSE README.md

      - name: Build windows/amd64
        if: steps.changes.outputs.skip != 'true'
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o outline.exe
          zip -j outline_windows_amd64.zip outline.exe LICENSE README.md

      - name: Build windows/arm64
        if: steps.changes.outputs.skip != 'true'
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o outline.exe
          zip -j outline_windows_arm64.zip outline.exe LICENSE README.md

      - name: Generate completion scripts
        if: steps.changes.outputs.skip != 'true'
        run: |
          mkdir -p completions
          go run . completion bash > completions/outline.bash
          go run . completion zsh > completions/outline.zsh
          go run . completion fish > completions/outline.fish
          tar czf outline_completions.tar.gz -C completions .

      - name: Build and push multi-arch image
        if: steps.changes.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compute lowercase image name
        if: steps.changes.outputs.skip != 'true'
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Sign image with cosign
        if: steps.changes.outputs.skip != 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"

      - name: Attest build provenance
        if: steps.changes.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create release with auto-generated notes
        if: steps.changes.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            $PRERELEASE_FLAG \
            outline_linux_amd64.tar.gz \
            outline_linux_arm64.tar.gz \
            outline_linux_armv7.tar.gz \
            outline_darwin_amd64.tar.gz \
            outline_darwin_arm64.tar.gz \
            outline_windows_amd64.zip \
            outline_windows_arm64.zip \
            outline_completions.tar.gz
