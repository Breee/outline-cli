name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"

      - run: make vet

      - run: make test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"

      - run: make e2e

  docs:
    name: Docs freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - run: make docs

      - name: Check for uncommitted docs changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Docs are out of date. Run 'make docs' and commit the result."
            git diff
            exit 1
          fi

      - name: Verify Hugo build
        run: hugo --minify --source docs
